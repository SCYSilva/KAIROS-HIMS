# frontend/nginx.conf

server {
    listen 8080;

    # 1. Serve the React Application
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # This is the magic line for React Router (SPA)
        # It tells NGINX: "If you can't find a file, just serve index.html"
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to the Backend Container
    # Whenever the frontend makes a request to /api/..., NGINX will forward it to the backend container
    location /api/ {
        # 'backend' is the service name defined in docker-compose.yml
        proxy_pass http://backend:5000/api/;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}